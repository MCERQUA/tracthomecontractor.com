<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Form Registration</title></head>
<body>
<!-- Netlify static form-detection decoy. Never linked in nav; registers both forms + all fields. -->

<form name="contact" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input name="bot-field" />
  <input name="name" />
  <input name="phone" />
  <input name="email" />
  <textarea name="message"></textarea>
  <input type="hidden" name="traffic_source" />
  <input type="hidden" name="landing_url" />
</form>

<form name="quote" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input name="bot-field" />
  <input name="name" />
  <input name="phone" />
  <input name="email" />
  <input name="service" />
  <input name="address" />
  <textarea name="details"></textarea>
  <input type="hidden" name="traffic_source" />
  <input type="hidden" name="landing_url" />

                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">City</label>
                            <input type="text" name="city" autocomplete="address-level2" style="width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 0.25rem; box-sizing: border-box;" required>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">State</label>
                            <select name="state" autocomplete="address-level1" style="width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 0.25rem; box-sizing: border-box;" required><option value="">Select a state</option><option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option><option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option><option value="DC">District of Columbia</option><option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option><option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option><option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option><option value="MD">Maryland</option><option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option><option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option><option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option><option value="NY">New York</option><option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option><option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option><option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option><option value="UT">Utah</option><option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option><option value="WV">West Virginia</option><option value="WI">Wisconsin</option><option value="WY">Wyoming</option></select>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">ZIP Code</label>
                            <input type="text" name="zip" inputmode="numeric" autocomplete="postal-code" pattern="\d{5}(-\d{4})?" maxlength="10" style="width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 0.25rem; box-sizing: border-box;" required>
                        </div></form>

</body>
</html>
